<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="form-container">
        <h1>Registration Form</h1>
        <form id="registrationForm">
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" name="firstName" required>

            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName" required>

            <label for="email">Email:</label>
            <input type="email" id="email">

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" minlength="6" required>

            <label for="birthdate">Birthdate:</label>
            <input type="date" id="birthdate" name="birthdate" required>
    </div>

    <div class="check-boxes">
        <p>Special Interests:</p>
        <label for="books">
            <input type="checkbox" id="books" name="specialinterests" value="Books"> Books
        </label>
        <label for="music">
            <input type="checkbox" id="music" name="specialinterests" value="Music"> Music
        </label>
        <label for="movies">
            <input type="checkbox" id="movies" name="specialinterests" value="Movies"> Movies
        </label>
    </div>

    <button type="submit">Submit</button>

    </form>


    <div id="output"></div>





    <script src="script.js"></script>
</body>

</html>
