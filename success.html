<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submitted Form</title>
    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <div class="output-container">
        <h1>Successful Registration!</h1>
        <div id="output"></div>
    </div>

    <script>
        const outputDiv = document.getElementById("output");

        const savedData = JSON.parse(localStorage.getItem("formData"));

        if (savedData) {
            outputDiv.innerHTML = `
        <p><strong>Name:</strong> ${savedData.firstName} ${savedData.lastName}</p>
        <p><strong>Email:</strong> ${savedData.email}</p>
        <p><strong>Birthdate:</strong> ${savedData.birthdate}</p>
        <p><strong>Special Interests:</strong> ${savedData.specialInterests.join(", ") || "None"}</p>
      `;
            localStorage.removeItem("formData");
        } else {
            outputDiv.textContent = "No data found.";
        }
    </script>

</body>

</html>
